name: platform-check
on:
  push:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: SDK loads (Node)
        run: node ci/sdk-load.js
      - name: Build renderer
        run: npm run build
      - name: App window smoke test (Electron, no key)
        shell: bash
        env:
          TWENTY_MOCK: ''
        run: npx electron ci/smoke-main.js
      - name: Package (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
